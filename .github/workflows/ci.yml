name: CI

# Push/PR check for the prerequisite mod: the seven local gates, on a clean checkout, with nothing
# assumed about a sibling repository. US's own CI is the place that pair is verified; a green run here
# means the library is internally sound, not that a consumer still compiles against it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: every gate run in this repo's history used 10.0.204, so the runner reproduces
          # the machine the evidence was produced on. (8.0.x builds this repo fine on a clean
          # checkout - measured - but an obj/ restored by one SDK major fails NETSDK1047 when the
          # other builds it, so mixing majors across CI and local is the trap, and pinning to the
          # proven major keeps both sides identical. net472 targeting resolves via NuGet either way.)
          dotnet-version: '10.0.x'

      # Required before verify-local: gate 1 runs `dotnet run --no-restore`, and a fresh checkout
      # has no obj/ to restore from. Two explicit projects, not a solution file: this repo ships
      # no .sln/.slnx on purpose (slnx additionally needs SDK >= 9.0.200, and a sibling's CI shows
      # the file buys nothing a pipeline can't do in one more line). net472 reference assemblies
      # come from the restore graph - Krafs.Rimworld.Ref mirrors the game's Managed folder - so
      # this step is also what proves the targeting packs resolve from NuGet alone.
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Source/FerriteLib.UiKit/FerriteLib.UiKit.csproj --nologo
          dotnet restore tools/FerriteLib.UiKit.Tests/FerriteLib.UiKit.Tests.csproj --nologo

      - name: "Verify (7 gates: harness, Dev/Release builds, payload, content-free, LICENSE, identity)"
        shell: pwsh
        run: ./scripts/verify-local.ps1
