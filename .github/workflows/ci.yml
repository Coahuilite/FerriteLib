name: CI

# Push/PR check for the prerequisite mod: the complete local entry, on a clean checkout, with nothing
# assumed about a sibling repository. US's own CI is the place that pair is verified; a green run here
# means the library is internally sound, not that a consumer still compiles against it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# rc iteration is fast push-tag cycles; a new push cancels the in-flight check of the same branch
# instead of letting the runner spend Windows minutes on a commit that is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    # A hung runner should burn 10, not the 360 default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The no-platform target requires SDK10; do not mix SDK majors within a run.
          dotnet-version: '10.0.x'


      # Download cache only: every graph is restored and every executable is built from source.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-fl-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-fl-nuget-

      - name: Verify complete Core, Release, Dev and adapter contracts
        shell: pwsh
        run: ./scripts/verify-local.ps1 -EvidenceFooter -LogDirectory dist/verification/ci

      - name: Retain complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-verification-${{ github.run_id }}
          path: dist/verification/
          if-no-files-found: warn
