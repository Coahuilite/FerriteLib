name: Release

# Push a SemVer tag (v0.2.0, v0.2.1-rc1) and this publishes the mod package that players download.
#
# This repository is the ONLY publisher of FerriteLib.UiKit.dll. Consumer repositories link to the
# asset produced here instead of shipping or rebuilding their own copy - two carriers of the same
# assembly bind by load order through RimWorld's single global AssemblyResolve, and the copy that
# loses has no way to find out. So the artifact's identity is part of the contract, not a detail:
# the tag, the build axis, the DLL's own version resource and the release notes all have to agree,
# and each of those agreements is checked below rather than assumed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # creating a GitHub Release

jobs:
  release:
    runs-on: windows-latest
    # Bound hung runners; elapsed time depends on restore and the actual contract inventory.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ancestry check below needs origin/main, not a depth-1 clone

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match ci.yml (see the note there for why 10.0.x is the pinned major).
          dotnet-version: '10.0.x'

      - name: Verify the tag is a release of this exact commit on main
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG

          # 1. Shape. Prereleases are rc-only (maintainer decision, 2026-09-05): every iteration
          #    before the release takes a tag vBASE-rcN, N starting at 1 and incrementing; a bare
          #    vBASE is the final release. Other suffixes (-dev, -alpha, -fix1, rc0) are rejected so
          #    the release page speaks exactly two dialects. SemVer-compatible: rcN is still a valid
          #    prerelease label, so GitHub's "is this a prerelease" rule and any version parser keep
          #    working, and rc1 < rc2 < BASE orders correctly.
          $pattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-rc([1-9]\d*))?$'
          if ($tag -notmatch $pattern) { throw "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN (N >= 1): $tag" }
          $base = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $rc = $Matches[4]

          # 2. The tag must name the build axis, which is what the artifact gets called.
          [xml]$csproj = Get-Content -LiteralPath 'Source/FerriteLib.UiKit/FerriteLib.UiKit.csproj' -Raw
          $prefix = @($csproj.SelectNodes('/Project/PropertyGroup/VersionPrefix'))
          if ($prefix.Count -ne 1) { throw "Expected exactly one <VersionPrefix>, found $($prefix.Count)." }
          $buildAxis = $prefix[0].InnerText.Trim()
          if ($buildAxis -ne $base) {
            throw "Tag v$base does not match <VersionPrefix>$buildAxis. Retag, or bump the build axis and rebuild; do not rename the artifact."
          }

          # 3. Tag the merge commit on main, not a feature branch tip: a release whose commit is not
          #    in main's history is a build of code that is not in the trunk anyone reads.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $commit = (git rev-parse 'HEAD^{commit}').Trim()
          git merge-base --is-ancestor $commit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag commit $commit is not in origin/main history. Merge to main, then tag." }

          # 4. rc ordering, and the release-equals-tested-rc invariant. Iterations strictly go rc1,
          #    rc2, ... (a skipped or reused number means a trial was retagged over, which is how
          #    changelog/artifact mismatches get born). Once any rc exists for a base, the bare
          #    vBASE must point at the SAME commit as the highest rc: players tested exactly the
          #    bytes that ship, and "one more fix right before release" becomes rc(N+1) with its own
          #    trial instead of an untested final tag. Tags are local here because checkout used
          #    fetch-depth: 0; no network call is made.
          $maxRc = 0
          foreach ($t in @(git tag --list "v$base-rc*")) {
            if (-not $t) { continue }
            # Exclude the tag being verified: on a checkout of v0.2.0-rc2 the local tag list already
            # contains rc2 itself, so counting it would demand rc3 and reject every legitimate push.
            if ($t -eq $tag) { continue }
            if ($t -match '-rc([1-9]\d*)$') {
              $n = [int]$Matches[1]
              if ($n -gt $maxRc) { $maxRc = $n }
            }
          }
          if ($rc) {
            if ([int]$rc -ne ($maxRc + 1)) {
              throw "Tag $tag is out of order: highest existing rc for v$base is rc$maxRc, so the next iteration must be v$base-rc$($maxRc + 1)."
            }
          } elseif ($maxRc -gt 0) {
            $lastRcRef = "v$base-rc$maxRc"
            $lastRcCommit = (git rev-list -n 1 $lastRcRef 2>$null | Select-Object -First 1)
            if (-not $lastRcCommit) { throw "Cannot resolve $lastRcRef locally; checkout must carry all tags (fetch-depth: 0)." }
            if ($commit -ne $lastRcCommit.Trim()) {
              throw "Final release v$base must tag the same commit as $lastRcRef, the exact build testers tried. HEAD is $commit but $lastRcRef was $lastRcCommit. Land the fix, then cut v$base-rc$($maxRc + 1) and trial that."
            }
          }


      # Download cache only: every graph is restored and every executable is built from source.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-fl-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-fl-nuget-

      # Order matters. verify-local's Release output in dist/build/Release carries a
      # -dev version suffix, and pack-release.ps1 refuses to publish that identity. So the gates run
      # first, on the tree exactly as tagged, and only then is the payload rebuilt as the artifact.
      - name: Verify complete contracts
        shell: pwsh
        run: ./scripts/verify-local.ps1 -EvidenceFooter -LogDirectory dist/verification/release

      - name: Audit current tree and complete reachable history
        shell: pwsh
        run: ./scripts/privacy-audit.ps1 -FullHistory
      # Keep the base suffix for both rc/final tags: the final tag must ship its tested rc bytes.
      # This final clean identity build remains separate from verification.
      - name: Build the release payload
        shell: pwsh
        run: dotnet build Source/FerriteLib.UiKit/FerriteLib.UiKit.csproj -c Release -p:VersionSuffix= --no-restore --no-incremental --nologo

      - name: Pack the release asset
        id: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # No -AllowDirtyTree: the runner's checkout is clean by construction, so if this ever trips,
          # something has written into the tracked tree mid-pipeline and the artifact is unattributable.
          ./scripts/pack-release.ps1 -Version $env:RELEASE_TAG | Tee-Object -FilePath pack-release.log
          $zip = "dist/github/FerriteLib-$env:RELEASE_TAG.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Expected asset was not produced: $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "asset=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "commit=$((git rev-parse HEAD))" >> $env:GITHUB_OUTPUT

      - name: Write the release body
        id: body
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_SHA256: ${{ steps.pack.outputs.sha256 }}
          ASSET_COMMIT: ${{ steps.pack.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$about = Get-Content -LiteralPath 'About/About.xml' -Raw
          $packageId = $about.SelectSingleNode('/ModMetaData/packageId').InnerText.Trim()

          # rc mechanism (2026-09-05): every trial of a base is vBASE-rcN. Show testers what changed
          # since the previous trial (or since the last base's final release for rc1), because the
          # whole point of the rc number is "try exactly this delta".
          $tag = $env:RELEASE_TAG
          $all = @(& git tag --list 'v*' --sort=v:refname)
          $idx = [Array]::IndexOf($all, $tag)
          $prevTag = if ($idx -gt 0) { $all[$idx - 1] } else { $null }
          if ($prevTag) {
            $range = "$prevTag..$tag"
            $commits = @(& git log --oneline "$range" 2>$null)
          } else {
            $range = $tag
            $commits = @(& git log --oneline -10 $tag 2>$null)
          }
          $delta = if ($commits.Count -gt 0) { ($commits | ForEach-Object { "- $_" }) -join "`n" } else { "- (no recorded commits in range)" }
          $isRc = $tag -match '-rc[1-9]\d*$'
          $trialNote = if ($isRc) { "This is a **release candidate**: an early-testing build. Try it, and report what breaks - problems found here are problems not shipped to everyone. UI/UX and copy work on this line is still in progress." } else { "This is the stable release. It carries the same bytes as its last release candidate; the identity table below names the commit." }
          $deltaTitle = if ($prevTag) { "## Changes since $prevTag" } else { "## Changes" }
          $notesPath = "docs/release-notes/$tag.md"
          $releaseNotes = if (Test-Path -LiteralPath $notesPath) { Get-Content -LiteralPath $notesPath -Raw } else { '' }
          $body = @"
          $trialNote

          FerriteLib is a **prerequisite library mod** for Coahuilite mods that use its UI kit. It adds no game content of any kind - no Defs, no patches, no textures - and its entire payload is ``1.6/Assemblies/FerriteLib.UiKit.dll``.

          ## Installing

          1. Unzip this archive **directly into** ``RimWorld/Mods/``. It contains a top-level ``FerriteLib`` folder, so the result is ``Mods/FerriteLib/...``.
          2. Install the mod that needs it (currently Universal Squeaker) from its own releases page.
          3. Enable both in the mod list. RimWorld will warn if the consumer is enabled without this one.

          Do **not** copy ``FerriteLib.UiKit.dll`` into another mod's folder. Exactly one carrier of that assembly may be installed; two of them bind by load order through the game's single global ``AssemblyResolve`` and the copy that loses has no way to find out.

          ## Version identity

          | | |
          |---|---|
          | Package id | ``$packageId`` |
          | Release | ``$env:RELEASE_TAG`` |
          | Game | RimWorld 1.6 |
          | Built from commit | ``$env:ASSET_COMMIT`` |
          | ZIP asset SHA-256 | ``$env:ASSET_SHA256`` |

          The SHA-256 above identifies the downloaded ``FerriteLib-$env:RELEASE_TAG.zip`` archive, not the DLL inside it. The extracted ``version.txt`` separately records the payload DLL's SHA-256. The consumer repository links to this release instead of shipping another copy. The full source of this exact build is ``$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY`` at tag ``$env:RELEASE_TAG`` (commit ``$env:ASSET_COMMIT``); the license terms travel inside the package as ``LICENSE``.

          $releaseNotes

          $deltaTitle

          $delta

          ## Status

          Supported stable contracts protect source, compiled consumers, XML vocabulary, behavior and legal use conditions within the same game/adapter target. After publication, breaking one requires a major release. Deprecation also retains the old contract through two complete subsequent published minors; that minimum does not permit a breaking minor removal, and a 1.x transition cannot shorten it. Experimental surface changes require explicit migration. Consumers still assert their tested API range in code, because RimWorld's ``modDependencies`` cannot express a version.

          This build targets **RimWorld 1.6**. The user accepted the ea610fa/833c14f4 internal trial for RC preparation; detailed unrecorded native cases remain known limits, not a demand to repeat that trial. FerriteLib adds nothing to saves and stores no settings of its own; keep it installed while any consumer mod (currently Universal Squeaker) depends on it.

          Testing status: current 0.8 technical evidence covers the complete engine-free core, retained controls and containers, editing/recovery protocols, public author paths and fixed-source consumer integration. This workflow runs the existing verification gates, including the Dev-only instrument, before building this fresh Release-configuration archive. Automated protocol/stub and source-integration results do not establish complete native gameplay acceptance. Headless game checks reported errors that the user accepted as non-blocking for this RC transition; they were not error-free. The internal trial is an overall acceptance, not a granular font/IME/resolution/all-action record. A compiled/native 1.7 adapter is not delivered and is not a gate for this 1.6 RC. Earlier 0.7 native checks do not accept this 0.8 package.
          "@
          $body | Out-File -FilePath release-body.md -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github/FerriteLib-${{ github.ref_name }}.zip
          body_path: release-body.md
          draft: false
          # A tag with a prerelease suffix is a prerelease; everything else is a release. No
          # generate_release_notes here: the body above is written for a player, not a changelog,
          # and the auto-generated notes would bury the install steps under commit titles.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false

      # Close the loop. Everything above verifies inputs; this verifies the OUTPUT as the platform
      # actually holds it: published (not draft), the prerelease boolean matches the tag dialect
      # (GitHub never infers it from the name - a mis-flagged rc silently becomes "Latest"), exactly
      # one asset, its server-computed digest equals the zip we packed, /releases/latest still hands
      # out a stable release, and no v* tag is left without a release. Excluding nothing: if this
      # step fails, the release exists but is wrong, which is precisely when a red X matters most.
      - name: Verify the release on the platform
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/verify-release.ps1 -Tag $env:RELEASE_TAG `
            -Repo "$env:GITHUB_REPOSITORY" `
            -ZipLocal "dist/github/FerriteLib-$env:RELEASE_TAG.zip"

      - name: Retain complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-verification-${{ github.run_id }}
          path: dist/verification/
          if-no-files-found: warn
